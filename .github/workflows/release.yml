name: Release

on:
  push:
    branches: [main]

permissions: {}

# Queue rather than cancel: interrupting a run halfway through publishing
# would leave some packages on npm and others not.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

# Three jobs, so that the job that can publish (id-token: write) installs and
# runs nothing from the dependency tree:
# 1. version: Changesets opens or updates the "Version packages" PR. When
#    main's packages carry versions npm does not have yet (that PR was merged),
#    this push is a release.
# 2. pack (a release only): installs, builds and packs every package.
# 3. publish (a release only): stages those tarballs on npm and, once all of
#    them have staged, tags each package's version and creates its GitHub
#    release, as changeset publish did.
#    A staged version goes public only once a maintainer approves it with 2FA,
#    on npmjs.com (Staged Packages) or with `npm stage approve <stage-id>`.

jobs:
  version:
    name: Version packages
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the version branch
      pull-requests: write # open and update the "Version packages" PR
    outputs:
      release: ${{ steps.release.outputs.release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # Installs pnpm from packageManager and Node from .node-version. No cache,
      # and no install scripts next to the token this job holds: Changesets
      # needs neither.
      - uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          cache: false
          install: false
      - run: pnpm install --frozen-lockfile --ignore-scripts
      # Before changesets/action, which leaves the checkout on its version
      # branch with the pending changesets applied: the check has to read
      # main's manifests, not the next versions.
      - name: Does npm lack any package's version?
        id: release
        run: |
          release=false
          for manifest in packages/*/package.json; do
            spec="$(node -p 'const p = require("./" + process.argv[1]); p.private ? "" : `${p.name}@${p.version}`' "$manifest")"
            [ -z "$spec" ] && continue
            if ! npm view "$spec" version >/dev/null 2>&1; then
              echo "$spec is not on npm"
              release=true
            fi
          done
          echo "release=$release" >> "$GITHUB_OUTPUT"
      - name: Create or update the "Version packages" pull request
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          # No publish-script: publishing is the publish job's, below.
          version-script: pnpm run version-packages
          commit-message: "Version packages"
          pr-title: "Version packages"

  pack:
    name: Build and pack
    needs: version
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No cache: a release builds from a clean install.
      - uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          cache: false
          require-lockfile: true
      - run: pnpm run build
      - run: pnpm run lint:publish
      # pnpm pack rewrites workspace: ranges to the versions being released.
      - name: Pack
        run: |
          mkdir release
          for manifest in packages/*/package.json; do
            if [ "$(node -p 'require("./" + process.argv[1]).private === true' "$manifest")" = true ]; then continue; fi
            (cd "$(dirname "$manifest")" && pnpm pack --pack-destination "$GITHUB_WORKSPACE/release")
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: packages
          path: release/*.tgz
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Stage on npm
    needs: pack
    runs-on: ubuntu-latest
    # The npm packages' trusted publisher names this workflow file, and only
    # needs to allow staged publishes.
    permissions:
      contents: write # each version's tag and GitHub release
      id-token: write # npm trusted publishing and provenance
    steps:
      # For the CHANGELOG.md files only: nothing from the checkout is installed or run.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packages
          path: release
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Check npm's version
        run: |
          # Staged publishing needs npm 11.15.0 or later.
          npm_version="$(npm --version)"
          node -e '
            const [a, b] = process.argv[1].split(".").map(Number);
            if (a < 11 || (a === 11 && b < 15)) throw new Error(`npm ${process.argv[1]} cannot stage publishes (11.15.0 or later)`);
          ' "$npm_version"
      # Tarballs: no install, no lifecycle scripts. Provenance comes from
      # publishConfig.provenance in each package. A version already on npm is
      # skipped, so a run that failed partway can be re-run. Each stage ID goes
      # in the job summary, for approving. Every package is tried, so one run
      # shows every package that cannot stage, and the step fails if any could
      # not. The packages depend on each other's exact versions, so approve
      # nothing until all of them have staged: reject what a failed run staged,
      # fix the cause and re-run. A staged version is not on npm yet, and this
      # job cannot list stages (that needs a maintainer's login).
      - name: Stage on npm
        run: |
          failed=()
          for tarball in release/*.tgz; do
            name="$(tar -xOzf "$tarball" package/package.json | node -p 'JSON.parse(require("fs").readFileSync(0)).name')"
            version="$(tar -xOzf "$tarball" package/package.json | node -p 'JSON.parse(require("fs").readFileSync(0)).version')"
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "$name@$version is already on npm"
              continue
            fi
            if ! npm stage publish "./$tarball" > stage.log; then
              cat stage.log
              echo "::error::Could not stage $name@$version"
              failed+=("$name@$version")
              continue
            fi
            cat stage.log
            stage_id="$(sed -n 's/.*(staged with id \(.*\))$/\1/p' stage.log)"
            echo "Staged $name@$version: approve it under Staged Packages on npmjs.com, or with \`npm stage approve ${stage_id:-<stage-id>}\`." >> "$GITHUB_STEP_SUMMARY"
          done
          if [ ${#failed[@]} -gt 0 ]; then
            echo "**Could not stage ${failed[*]}.** Do not approve the versions above: reject them, fix the cause and re-run this job." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
      # Only once every package has staged. An existing tag is skipped, so the
      # job can be re-run.
      - name: Tag and create GitHub releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for tarball in release/*.tgz; do
            name="$(tar -xOzf "$tarball" package/package.json | node -p 'JSON.parse(require("fs").readFileSync(0)).name')"
            version="$(tar -xOzf "$tarball" package/package.json | node -p 'JSON.parse(require("fs").readFileSync(0)).version')"
            tag="$name@$version"
            if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
              echo "$tag is already tagged"
              continue
            fi
            # The version's section of the package's CHANGELOG.md, or GitHub's generated notes.
            dir="$(dirname "$(grep -l "\"name\": \"$name\"" packages/*/package.json)")"
            awk -v v="$version" '$0 == "## " v { on = 1; next } on && /^## / { exit } on' "$dir/CHANGELOG.md" 2>/dev/null > notes.md || true
            if [ -s notes.md ]; then notes=(--notes-file notes.md); else notes=(--generate-notes); fi
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$tag" "${notes[@]}"
          done

name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  id-token: write

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Version or publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Installs pnpm from packageManager, Node from .node-version, and runs
      # the install itself. No .npmrc is written, so nothing carries registry
      # credentials into the install and build below.
      - uses: pnpm/setup@v3
        with:
          cache: true
          require-lockfile: true
      - run: pnpm run build
      - name: Create release pull request or publish
        uses: changesets/action@v2
        with:
          version-script: pnpm run version-packages
          publish-script: pnpm exec changeset publish
          commit-message: "Version packages"
          pr-title: "Version packages"
        env:
          # Registry and token together, on the publish step alone. Trusted
          # publishing replaces this once the packages exist on npm: pnpm does
          # the OIDC exchange itself, so the whole block goes away rather than
          # being swapped for another secret. Provenance comes from
          # publishConfig.provenance in each package, not from here.
          pnpm_config__auth: |
            {
              "https://registry.npmjs.org": {
                "@": {
                  "authToken": ${{ toJSON(secrets.NPM_TOKEN) }}
                }
              }
            }

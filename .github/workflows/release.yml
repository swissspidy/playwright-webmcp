name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  id-token: write

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Version or publish
    runs-on: ubuntu-latest
    env:
      # setup-node writes an .npmrc that reads the registry token from this variable.
      # Keep it empty for install and build; only the publish step below gets the secret.
      NODE_AUTH_TOKEN: ""
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - name: Create release pull request or publish
        uses: changesets/action@v2
        with:
          version-script: pnpm run version-packages
          publish-script: pnpm exec changeset publish
          commit-message: "Version packages"
          pr-title: "Version packages"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"

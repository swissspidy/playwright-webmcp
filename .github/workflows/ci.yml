name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, format, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Installs pnpm from packageManager, Node from .node-version, and runs
      # the install itself. require-lockfile makes that install --frozen-lockfile
      # and fails outright if the lockfile has gone missing.
      - uses: pnpm/setup@v3
        with:
          cache: true
          require-lockfile: true
      - run: pnpm run format:check
      - run: pnpm run build
      - run: pnpm run typecheck
      - run: pnpm run lint:publish
      - run: pnpm run docs:rules:check
      - run: pnpm run test:unit
      - run: pnpm run lint

  e2e:
    # Playwright's Chromium implements WebMCP behind --enable-features=WebMCP, which the
    # Playwright configs pass; no other browser is needed.
    name: Playwright (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [24, 26]
    steps:
      - uses: actions/checkout@v7
      # An explicit runtime outranks .node-version, so the matrix still picks
      # the Node version even though the file pins the one the packages target.
      - uses: pnpm/setup@v3
        with:
          runtime: node@${{ matrix.node }}
          cache: true
          require-lockfile: true
      - run: pnpm run build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm run test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-results-node${{ matrix.node }}
          path: |
            packages/*/test-results
            packages/*/playwright-report
            examples/*/test-results
          retention-days: 7

  beta:
    # The same suites on Google Chrome Beta, one milestone ahead of Playwright's
    # Chromium, so API changes show up before they reach the stable build. Chrome
    # Beta moves every week; this job is informational and does not block merges.
    name: Chrome Beta
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v3
        with:
          cache: true
          require-lockfile: true
      - run: pnpm run build
      - run: pnpm exec playwright install --with-deps chrome-beta
      - run: /opt/google/chrome-beta/chrome --version
      - run: pnpm run test:beta
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-results-beta
          path: |
            packages/*/test-results
            examples/*/test-results
          retention-days: 7

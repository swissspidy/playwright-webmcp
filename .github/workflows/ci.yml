name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, format, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Installs pnpm from packageManager, Node from .node-version, and runs
      # the install itself. require-lockfile makes that install --frozen-lockfile
      # and fails outright if the lockfile has gone missing.
      - uses: pnpm/setup@731dfb6463bbd11c11fd0ee11fe00ed0e36d48a1 # v3.2.0
        with:
          cache: true
          require-lockfile: true
      - run: pnpm run format:check
      - run: pnpm run build
      - run: pnpm run typecheck
      - run: pnpm run lint:publish
      - run: pnpm run docs:rules:check
      - run: pnpm run test:unit
      - run: pnpm run lint

  e2e:
    # The suites on Google Chrome: Stable, which is what WebMCP users run and must stay
    # green, and Dev, where API changes land first. Dev moves weekly and the specification
    # is still changing, so that leg is informational and does not block merges. The
    # Playwright configs pass --enable-features=WebMCP; PW_CHROMIUM picks the binary.
    name: Playwright (Chrome ${{ matrix.channel }}, Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.channel == 'dev' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - channel: stable
            node: 24
            package: google-chrome-stable
            executable: /opt/google/chrome/chrome
          - channel: stable
            node: 26
            package: google-chrome-stable
            executable: /opt/google/chrome/chrome
          - channel: dev
            node: 26
            package: google-chrome-unstable
            executable: /opt/google/chrome-unstable/chrome
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # An explicit runtime outranks .node-version, so the matrix still picks
      # the Node version even though the file pins the one the packages target.
      - uses: pnpm/setup@731dfb6463bbd11c11fd0ee11fe00ed0e36d48a1 # v3.2.0
        with:
          runtime: node@${{ matrix.node }}
          cache: true
          require-lockfile: true
      - run: pnpm run build
      # Google's own package for the channel, installed over whatever the runner image ships, so
      # each leg gets the channel's current build. Playwright's installer has no Chrome Dev target.
      - name: Install Chrome ${{ matrix.channel }}
        run: |
          curl -fsSLo "$RUNNER_TEMP/chrome.deb" "https://dl.google.com/linux/direct/${{ matrix.package }}_current_amd64.deb"
          sudo apt-get update -qq
          sudo apt-get install -y "$RUNNER_TEMP/chrome.deb"
      - run: ${{ matrix.executable }} --version
      - run: pnpm run test:e2e
        env:
          PW_CHROMIUM: ${{ matrix.executable }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-results-${{ matrix.channel }}-node${{ matrix.node }}
          path: |
            packages/*/test-results
            packages/*/playwright-report
            examples/*/test-results
          retention-days: 7

version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      playwright:
        patterns:
          - "@playwright/*"
          - playwright
          - playwright-core
      typescript:
        patterns:
          - typescript
          - "@types/*"
      tooling:
        patterns:
          - "@changesets/*"
          - prettier
          - publint
    versioning-strategy: increase

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns:
          - "*"
